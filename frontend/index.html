<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Nitya keeps your day: the routines and habits you set yourself, what is done, what is next, and what it adds up to." />
    <meta name="theme-color" content="#faf8f4" />
    <!-- The mark, drawn for both themes; the PNG is for browsers that do not take an SVG -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Added to a phone's home screen, the app opens on its own, without the browser around it -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nitya" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The interface's typeface is asked for at once, so the first words are set in it -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/hanken-grotesk/files/hanken-grotesk-latin-wght-normal.woff2"
    />
    <script>
      // Applies the saved theme before the first paint, so the page never flashes the wrong one.
      // The keys and defaults are the ones in src/lib/appearance.js; the two colours are --paper in src/styles/tokens.css.
      (function () {
        var root = document.documentElement;
        var theme = "light";
        var motion = "system";
        try {
          theme = localStorage.getItem("nitya.theme") || theme;
          motion = localStorage.getItem("nitya.motion") || motion;
        } catch (error) {
          // storage is blocked: the defaults apply
        }
        if (theme === "system") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        root.dataset.theme = theme === "dark" ? "dark" : "light";
        if (motion === "reduce") root.dataset.motion = "reduce";
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "dark" ? "#1b1a18" : "#faf8f4");
      })();
    </script>
    <title>Nitya</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
