<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The mark: three Day Strip segments, the last one still to be filled. The colours are the ink, paper and meta tokens of each theme. -->
  <style>
    .tile { fill: #1f1d1a }
    .done { fill: #faf8f4 }
    .open { fill: #8a8479 }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #ece8e1 }
      .done { fill: #1b1a18 }
      .open { fill: #a69f94 }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7"/>
  <rect class="done" x="6" y="8.5" width="5" height="15" rx="1.5"/>
  <rect class="done" x="13.5" y="8.5" width="5" height="15" rx="1.5"/>
  <rect class="open" x="21" y="8.5" width="5" height="15" rx="1.5"/>
</svg>
